#    healthcheck:
#      test: [ "CMD", "mongod", "--version" ]
#      interval: 5s
#      timeout: 10s
#      retries: 3
#      start_period: 0s
#      start_interval: 5s
#    entrypoint: ["mongod", "--replSet", "recipesReplicaSet", "--bind_ip", "localhost,mongo2"]
#
#  mongo3:
#    image: mongo:6
#    hostname: mongo3
#    container_name: mongo3
#    ports:
#      - 27029:27017
#    volumes:
#      - mongo-3-recipes-data:/data/db
#    restart: always
#    healthcheck:
#      test: [ "CMD", "mongod", "--version" ]
#      interval: 5s
#      timeout: 10s
#      retries: 3
#      start_period: 0s
#      start_interval: 5s
#    entrypoint: ["mongod", "--replSet", "recipesReplicaSet", "--bind_ip", "localhost,mongo3"]

  mongosetup:
    image: mongo:6
    depends_on:
      mongo1:
        condition: service_healthy
#      mongo2:
#        condition: service_healthy
#      mongo3:
#        condition: service_healthy
    volumes:
      - ./:/deployment
    restart: "no"
    entrypoint: ["bash", "/deployment/deployment/mongo/mongo_setup.sh"]

volumes:
  recipes-app-data:
  mongo-1-recipes-data:
#  mongo-2-recipes-data:
