# sets up a docker container for the application, a mongo replica set consisting
# of one node, and migrates the mongo recipe schema to the current version.
services:

  app:

    container_name: recipes-server

    # want to wait until the "mongosetup" finishes successfully
    # before starting this. largely this is so that we can do
    # a migrate-mongo to bring the database to the current version
    depends_on:
      mongosetup:
        condition: service_completed_successfully

    # build the image from the Dockerfile in this same directory
    build: .

    ports:
      - 127.0.0.1:8081:3000
    working_dir: /usr/app
    volumes:
      - recipes-app-data:/usr/app


    # variables for next auth (need to move the secret into a secret)
    # (holds the next-auth secret and should be unique for your deployment)
    env_file:
      - deployment/.env.compose

    # general next-auth variables that will likely remain the same
    # across deployments
    environment:
      NEXTAUTH_URL_INTERNAL: 'http://localhost:3000'
      NEXTAUTH_URL: 'http://localhost:8081'

    # install all the dependencies and start the dev server
    command: sh -c "\
      deployment/mongo/migrate_mongo.sh && \
      npm run start"

  # set up the mongo cluster
  mongo1:
    image: mongo:6
    hostname: mongo1
    container_name: mongo1
    ports:
      - 27027:27017
    volumes:
      - mongo-1-recipes-data:/data/db
    restart: always
    entrypoint: ["mongod", "--replSet", "recipesReplicaSet", "--bind_ip", "localhost,mongo1"]

  mongo2:
    image: mongo:6
    hostname: mongo2
    container_name: mongo2
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - 27028:27017
    volumes:
      - mongo-2-recipes-data:/data/db
    restart: always
    entrypoint: ["mongod", "--replSet", "recipesReplicaSet", "--bind_ip", "localhost,mongo2"]

  mongo3:
    image: mongo:6
    hostname: mongo3
    container_name: mongo3
    ports:
      - 27029:27017
    volumes:
      - mongo-3-recipes-data:/data/db
    restart: always
    entrypoint: ["mongod", "--replSet", "recipesReplicaSet", "--bind_ip", "localhost,mongo3"]

  mongosetup:
    image: mongo:6
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    volumes:
      - ./:/deployment
    restart: "no"
#    command: "find / -name 'mongo_setup.sh'"
    entrypoint: ["bash", "/deployment/deployment/mongo/mongo_setup.sh"]

volumes:
  recipes-app-data:
  mongo-1-recipes-data:
  mongo-2-recipes-data:
  mongo-3-recipes-data: