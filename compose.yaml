#    hostname: mongo2
#    container_name: mongo2
#    environment:
#      MONGO_INITDB_ROOT_USERNAME: root
#      MONGO_INITDB_ROOT_PASSWORD: example
#    ports:
#      - 27028:27017
#    volumes:
#      - mongo-2-recipes-data:/data/db
